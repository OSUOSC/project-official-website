baseURL = 'https://osuosc.org/'
languageCode = 'en-us'
title = 'Open Source Club'
theme = 'beautifulhugo'

[[menu.main]]
    name = "About"
    url = "/about"

[[menu.main]]
    name = "Events"
    url = "/events"

[Params]
#  homeTitle = "Beautiful Hugo Theme" # Set a different text for the header on the home page
  subtitle = "At The Ohio State University"
  mainSections = ["post","posts"]
  logo = "img/icon.png"
  favicon = "img/favicon.ico"
  dateFormat = "January 2, 2006"
  commit = false
  rss = true
  comments = true
  readingTime = true
  wordCount = true
  useHLJS = true
  socialShare = true
  delayDisqus = true
  showRelatedPosts = true

[Params.author]
  # Set only your "username" for default hosts and full URLs otherwise (e.g., "https://MyGitLab.org/username")
  name = "OSU OSC"

